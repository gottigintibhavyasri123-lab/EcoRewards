<style>
/* Layout: a single phone-sized app centred on a brown backdrop; full screen on small devices.
   Palette: brown and white only. Type: Bricolage Grotesque for display, DM Sans for text, Noto for Indic/Arabic scripts. */
:root{
  --b900:#2b190d; --b800:#41271a; --b700:#5c3924; --b600:#7a4d31; --b400:#a77858; --b200:#dac3af; --b100:#eee1d5; --b50:#f8f2ec; --white:#fffefd;
  --display:'Bricolage Grotesque','Noto Sans Devanagari','Noto Sans Telugu','Noto Sans Tamil','Noto Sans Kannada','Noto Sans Malayalam','Noto Sans Bengali','Noto Sans Arabic',system-ui,sans-serif;
  --text:'DM Sans','Noto Sans Devanagari','Noto Sans Telugu','Noto Sans Tamil','Noto Sans Kannada','Noto Sans Malayalam','Noto Sans Bengali','Noto Sans Arabic',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--b800);color:var(--b900);font-family:var(--text);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:16px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--b400);outline-offset:2px}
.stage{height:100%;display:flex;justify-content:center;align-items:center;gap:40px}
.intro{max-width:300px;color:var(--b100);display:none}
.intro h1{font-family:var(--display);font-size:40px;line-height:1.05;margin:0 0 12px;color:var(--white)}
.intro p{margin:0 0 10px;color:var(--b200)}
@media(min-width:900px){.intro{display:block}}
.phone{width:100%;max-width:400px;height:100%;max-height:820px;background:var(--white);border-radius:32px;display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 0 0 8px var(--b900),0 30px 60px rgba(0,0,0,.35)}
@media(max-width:480px){body{padding:0}.phone{max-height:none;border-radius:0;box-shadow:none}}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 10px;background:var(--b700);color:var(--white)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:20px}
.brand svg{width:26px;height:26px}
.langbtn{display:flex;align-items:center;gap:6px;background:var(--b600);border:1px solid var(--b400);color:var(--white);border-radius:999px;padding:6px 12px;font-weight:500}
.langbtn svg{width:16px;height:16px}
main{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;background:var(--white)}
nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--b200);background:var(--white);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{border:0;background:none;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--b400)}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--b700);font-weight:700}
nav button[aria-current="page"] svg{stroke-width:2.4}
h2{font-family:var(--display);font-size:20px;margin:0;line-height:1.15;text-wrap:balance}
h3{margin:0;font-size:15px}
.sm{font-size:12px;color:var(--b600)}
.hero{background:var(--b700);color:var(--white);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.hero .tag{font-size:13px;color:var(--b200)}
.pts{display:flex;align-items:baseline;gap:8px}
.pts b{font-family:var(--display);font-size:48px;line-height:1;font-variant-numeric:tabular-nums}
.pts span{color:var(--b200);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--b800);border-radius:12px;padding:8px 10px}
.stats b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stats span{font-size:11px;color:var(--b200)}
.trust{border:1.5px solid var(--b200);border-radius:16px;padding:14px;display:flex;gap:12px;background:var(--b50)}
.trust svg{width:34px;height:34px;flex:none;color:var(--b700)}
.trust p{margin:4px 0 8px;color:var(--b700)}
.link{background:none;border:0;padding:0;color:var(--b700);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0;padding:0;list-style:none}
.steps li{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:11.5px;font-weight:500}
.steps i{width:44px;height:44px;border-radius:50%;background:var(--b100);display:grid;place-items:center;color:var(--b700)}
.steps svg{width:22px;height:22px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;border:1px solid var(--b200);border-radius:14px;padding:12px;background:var(--white)}
.row .grow{flex:1;min-width:0}
.row .grow div{overflow-wrap:anywhere}
.thumb{width:48px;height:48px;border-radius:10px;background:var(--b100);flex:none;display:grid;place-items:center;color:var(--b700)}
.thumb svg{width:24px;height:24px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;background:var(--b700);color:var(--white)}
.btn:hover{background:var(--b800)}
.btn.ghost{background:var(--white);color:var(--b700);border:1.5px solid var(--b700)}
.btn.small{padding:7px 12px;font-size:13px}
.btn:disabled{background:var(--b100);color:var(--b400);cursor:not-allowed;border:0}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;background:var(--b100);color:var(--b700)}
.pill svg{width:12px;height:12px}
.pill.dark{background:var(--b700);color:var(--white)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{aspect-ratio:1;border:2px dashed var(--b400);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;background:var(--b50);position:relative;overflow:hidden;padding:8px}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop .lab{position:absolute;left:8px;bottom:8px;background:var(--b900);color:var(--white);border-radius:8px;padding:2px 8px;font-size:11px;font-weight:700}
.drop svg{width:28px;height:28px;color:var(--b600)}
.drop.off{opacity:.45}
.safety{border-radius:14px;background:var(--b100);padding:12px;display:flex;gap:10px;align-items:flex-start}
.safety svg{width:22px;height:22px;flex:none;color:var(--b700)}
.safety p{margin:2px 0 0;color:var(--b700)}
label.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500}
label.chk input{width:20px;height:20px;accent-color:var(--b700);flex:none;margin:0}
.checks{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--b50);border:1px solid var(--b200);color:var(--b600)}
.checks li svg{width:20px;height:20px;flex:none}
.checks li.done{color:var(--b900);background:var(--white)}
.checks li.run svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.win{text-align:center;background:var(--b700);color:var(--white);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:6px;align-items:center}
.win b{font-family:var(--display);font-size:40px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{border:1.5px solid var(--b200);background:var(--white);border-radius:999px;padding:6px 12px;white-space:nowrap;font-weight:500}
.chip[aria-pressed="true"]{background:var(--b700);color:var(--white);border-color:var(--b700)}
.map{border-radius:16px;border:1px solid var(--b200);background:var(--b50);width:100%;display:block}
.sheetbg{position:absolute;inset:0;background:rgba(43,25,13,.55);display:flex;align-items:flex-end;z-index:9}
.sheet{background:var(--white);width:100%;max-height:80%;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet .top{display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:var(--b100);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.langs button{border:1.5px solid var(--b200);background:var(--white);border-radius:12px;padding:10px;text-align:start;display:flex;flex-direction:column}
.langs button[aria-pressed="true"]{border-color:var(--b700);background:var(--b100)}
.langs small{color:var(--b600)}
.code{font-family:var(--display);font-size:26px;letter-spacing:.12em;text-align:center;border:2px dashed var(--b400);border-radius:14px;padding:14px;background:var(--b50)}
.toast{position:absolute;left:16px;right:16px;bottom:78px;background:var(--b900);color:var(--white);border-radius:12px;padding:10px 14px;z-index:6;font-weight:500}
.note{font-size:11.5px;color:var(--b600);text-align:center}
.splash{position:absolute;inset:0;z-index:8;background:var(--b700);color:var(--white);display:flex;flex-direction:column;padding:24px 22px calc(24px + env(safe-area-inset-bottom,0px));gap:16px}
.splash h1{font-family:var(--display);font-size:34px;line-height:1.05;margin:0;text-wrap:balance}
.splash .art{flex:1;min-height:0;display:grid;place-items:center;background:var(--white);border-radius:28px;padding:16px}
.splash .art svg{height:100%;max-height:300px;width:auto;max-width:90%}
.splash .brand{font-size:22px}
.btn.light{background:var(--white);color:var(--b800)}
.btn.light:hover{background:var(--b100)}
.progress{height:10px;border-radius:999px;background:var(--b100);overflow:hidden}
.progress i{display:block;height:100%;background:var(--b700);border-radius:999px}
.ptsys{border:1.5px solid var(--b200);border-radius:20px;padding:14px 14px 14px;display:flex;flex-direction:column;gap:2px}
.ptsys .row{border:0;border-bottom:1px solid var(--b200);border-radius:0;padding:12px 0}
.ptsys .v{font-family:var(--display);font-size:20px;font-weight:800;color:var(--b700);white-space:nowrap}
.ptsys .foot{display:flex;flex-direction:column;gap:6px;padding-top:12px}
.rbanner{background:var(--b700);color:var(--white);border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.hbtns{display:flex;gap:8px;align-items:center}
.bell{position:relative;width:36px;height:36px;border-radius:50%;border:1px solid var(--b400);background:var(--b600);color:var(--white);display:grid;place-items:center;padding:0}
.bell svg{width:18px;height:18px}
.bell i{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--white);color:var(--b800);font:700 11px/18px var(--text);text-align:center;font-style:normal;padding:0 4px}
.oban{background:var(--b900);color:var(--white);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
header .brand{margin-inline-end:auto}
.bell{position:relative;width:38px;height:38px;border-radius:50%;background:var(--b600);border:1px solid var(--b400);color:var(--white);display:grid;place-items:center;padding:0}
.bell svg{width:18px;height:18px}
#badge{position:absolute;top:-4px;inset-inline-end:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--white);color:var(--b800);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.note-item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--b200)}
.note-item svg{width:20px;height:20px;flex:none;color:var(--b700);margin-top:2px}
@media(prefers-reduced-motion:reduce){.checks li.run svg{animation:none}}
</style>
<style>img{max-width:100%}[hidden]{display:none!important}body{margin:0}</style>
</head>

te:['భూమికి మంచి చేయండి. మీ కృషికి బహుమతి పొందండి.','హోమ్','శుభ్రత','బహుమతులు','కార్యాలయాలు','మళ్లీ స్వాగతం','ఈకోపాయింట్లు','మీ ప్రభావం','శుభ్రం చేసిన ప్రదేశాలు','కిలోల చెత్త తొలగింపు','ధృవీకరించబడింది','ప్రతి శుభ్రతను తనిఖీ చేస్తాం','ఫోటోలను ప్రదేశం, సమయంతో సరిపోల్చి, పాయింట్లు ఇచ్చే ముందు మున్సిపల్ వాలంటీర్ సమీక్షిస్తారు.','మేము ఎలా ధృవీకరిస్తాం','చెత్త ఫోటో తీయండి','సురక్షితంగా శుభ్రం చేయండి','తర్వాత ఫోటో అప్‌లోడ్ చేయండి','ఈకోపాయింట్లు సంపాదించండి','మీ దగ్గర చెత్త ప్రదేశాలు','శుభ్రత ప్రారంభించండి','ముందు ఫోటో','తర్వాత ఫోటో','ఫోటో జోడించండి','ధృవీకరణకు పంపండి','ముందు భద్రత','చిన్న, పొడి చెత్తను మాత్రమే తీయండి. చేతి తొడుగులు ధరించండి. గాజు, సూదులు, వైద్య లేదా రసాయన చెత్తను ముట్టుకోవద్దు. వాటిని మున్సిపల్ కార్యాలయానికి తెలపండి.','నేను చేతి తొడుగులు ధరిస్తాను, ప్రమాదకర చెత్తను వదిలేస్తాను','రిడీమ్','ధృవీకరించిన భాగస్వామి','దగ్గరలోని మున్సిపల్ కార్యాలయాలు','కాల్','దారి','భాష','ఇది ప్రోటోటైప్ నమూనా డేటా. అసలు యాప్ మీ మున్సిపల్ డైరెక్టరీ నుండి తీసుకుంటుంది.','ఆమోదించబడింది! ఈకోపాయింట్లు చేరాయి.','పాయింట్లు','ఇంకా పాయింట్లు కావాలి','మీ కూపన్ కోడ్','మూసివేయి','తెరిచి ఉంది','మూసి ఉంది','దూరం'],
ta:['பூமிக்கு நன்மை செய்யுங்கள். உங்கள் பங்களிப்புக்கு பரிசு பெறுங்கள்.','முகப்பு','சுத்தம்','பரிசுகள்','அலுவலகங்கள்','மீண்டும் வருக','ஈகோபாயிண்ட்ஸ்','உங்கள் தாக்கம்','சுத்தம் செய்த இடங்கள்','கிலோ அகற்றம்','சரிபார்க்கப்பட்டது','ஒவ்வொரு சுத்தமும் சரிபார்க்கப்படும்','புகைப்படங்கள் இடம், நேரத்துடன் ஒப்பிடப்பட்டு, புள்ளிகள் வழங்கும் முன் நகராட்சி தன்னார்வலர் ஆய்வு செய்வார்.','நாங்கள் எப்படி சரிபார்க்கிறோம்','குப்பையை படம் எடுங்கள்','பாதுகாப்பாக சுத்தம் செய்யுங்கள்','பிந்தைய படத்தை பதிவேற்றுங்கள்','ஈகோபாயிண்ட்ஸ் பெறுங்கள்','உங்கள் அருகிலுள்ள குப்பை இடங்கள்','சுத்தம் தொடங்கு','முந்தைய படம்','பிந்தைய படம்','படம் சேர்','சரிபார்ப்புக்கு அனுப்பு','முதலில் பாதுகாப்பு','சிறிய, உலர்ந்த குப்பையை மட்டும் எடுங்கள். கையுறை அணியுங்கள். கண்ணாடி, ஊசி, மருத்துவ அல்லது ரசாயனக் கழிவைத் தொடாதீர்கள். அவற்றை நகராட்சி அலுவலகத்திற்குத் தெரிவியுங்கள்.','நான் கையுறை அணிவேன், ஆபத்தான கழிவை தவிர்ப்பேன்','மீட்டெடு','சரிபார்க்கப்பட்ட பங்குதாரர்','அருகிலுள்ள நகராட்சி அலுவலகங்கள்','அழை','வழி','மொழி','இது முன்மாதிரிக்கான மாதிரி தரவு. உண்மையான செயலி உங்கள் நகராட்சி பட்டியலைப் பயன்படுத்தும்.','அங்கீகரிக்கப்பட்டது! புள்ளிகள் சேர்ந்தன.','புள்ளி','மேலும் புள்ளிகள் தேவை','உங்கள் கூப்பன் குறியீடு','மூடு','திறந்துள்ளது','மூடப்பட்டது','தொலைவு'],
kn:['ಭೂಮಿಗೆ ಒಳ್ಳೆಯದನ್ನು ಮಾಡಿ. ನಿಮ್ಮ ಕೊಡುಗೆಗೆ ಬಹುಮಾನ ಪಡೆಯಿರಿ.','ಮುಖಪುಟ','ಸ್ವಚ್ಛತೆ','ಬಹುಮಾನಗಳು','ಕಚೇರಿಗಳು','ಮತ್ತೆ ಸ್ವಾಗತ','ಇಕೋಪಾಯಿಂಟ್ಸ್','ನಿಮ್ಮ ಪ್ರಭಾವ','ಸ್ವಚ್ಛಗೊಳಿಸಿದ ಸ್ಥಳಗಳು','ಕೆಜಿ ತೆರವು','ಪರಿಶೀಲಿತ','ಪ್ರತಿ ಸ್ವಚ್ಛತೆಯನ್ನೂ ಪರಿಶೀಲಿಸಲಾಗುತ್ತದೆ','ಫೋಟೋಗಳನ್ನು ಸ್ಥಳ ಮತ್ತು ಸಮಯದೊಂದಿಗೆ ಹೊಂದಿಸಿ, ಪಾಯಿಂಟ್ ನೀಡುವ ಮೊದಲು ನಗರಪಾಲಿಕೆ ಸ್ವಯಂಸೇವಕರು ಪರಿಶೀಲಿಸುತ್ತಾರೆ.','ನಾವು ಹೇಗೆ ಪರಿಶೀಲಿಸುತ್ತೇವೆ','ಕಸದ ಫೋಟೋ ತೆಗೆಯಿರಿ','ಸುರಕ್ಷಿತವಾಗಿ ಸ್ವಚ್ಛಗೊಳಿಸಿ','ನಂತರದ ಫೋಟೋ ಅಪ್‌ಲೋಡ್ ಮಾಡಿ','ಇಕೋಪಾಯಿಂಟ್ಸ್ ಗಳಿಸಿ','ನಿಮ್ಮ ಹತ್ತಿರದ ಕಸದ ಸ್ಥಳಗಳು','ಸ್ವಚ್ಛತೆ ಆರಂಭಿಸಿ','ಮೊದಲಿನ ಫೋಟೋ','ನಂತರದ ಫೋಟೋ','ಫೋಟೋ ಸೇರಿಸಿ','ಪರಿಶೀಲನೆಗೆ ಕಳುಹಿಸಿ','ಮೊದಲು ಸುರಕ್ಷತೆ','ಚಿಕ್ಕ, ಒಣ ಕಸವನ್ನು ಮಾತ್ರ ಎತ್ತಿ. ಕೈಗವಸು ಧರಿಸಿ. ಗಾಜು, ಸೂಜಿ, ವೈದ್ಯಕೀಯ ಅಥವಾ ರಾಸಾಯನಿಕ ಕಸವನ್ನು ಮುಟ್ಟಬೇಡಿ. ಅವನ್ನು ನಗರಪಾಲಿಕೆ ಕಚೇರಿಗೆ ತಿಳಿಸಿ.','ನಾನು ಕೈಗವಸು ಧರಿಸುತ್ತೇನೆ, ಅಪಾಯಕಾರಿ ಕಸ ಬಿಡುತ್ತೇನೆ','ರಿಡೀಮ್','ಪರಿಶೀಲಿತ ಪಾಲುದಾರ','ಹತ್ತಿರದ ನಗರಪಾಲಿಕೆ ಕಚೇರಿಗಳು','ಕರೆ','ದಾರಿ','ಭಾಷೆ','ಇದು ಪ್ರೋಟೋಟೈಪ್‌ನ ಮಾದರಿ ಡೇಟಾ. ನಿಜವಾದ ಆ್ಯಪ್ ನಿಮ್ಮ ನಗರಪಾಲಿಕೆ ಪಟ್ಟಿಯನ್ನು ಬಳಸುತ್ತದೆ.','ಅನುಮೋದಿಸಲಾಗಿದೆ! ಪಾಯಿಂಟ್ಸ್ ಸೇರಿದೆ.','ಪಾಯಿಂಟ್','ಇನ್ನಷ್ಟು ಪಾಯಿಂಟ್ ಬೇಕು','ನಿಮ್ಮ ಕೂಪನ್ ಕೋಡ್','ಮುಚ್ಚಿ','ತೆರೆದಿದೆ','ಮುಚ್ಚಿದೆ','ದೂರ'],

  const v=state.verify;
  if(v&&v.done&&v.result==='approved'){return `<div class="win">${svg('check','style="width:44px;height:44px"')}<b>+${v.pts}</b><div>${t('approved')}</div><button class="btn ghost small" style="margin-top:8px" data-act="reset">${t('start')}</button></div>
   <div class="photos"><div class="drop"><img alt="${t('before')}" src="${state.before}"><span class="lab">${t('before')}</span></div><div class="drop"><img alt="${t('after')}" src="${state.after}"><span class="lab">${t('after')}</span></div></div>`}
  if(v&&v.done){return `<div class="win" style="background:var(--b100);color:var(--b900)">${svg('shield','style="width:44px;height:44px"')}<h2>Not approved</h2><div>${v.reason}</div><div class="sm">${OFFICES[0].name}</div><button class="btn small" style="margin-top:8px" data-act="reset">Try again</button></div>`}
  if(v){return `<h2>${t('submit')}</h2><ul class="checks">${v.steps.map(s=>`<li class="${s.st}">${svg(s.st==='done'?'check':s.st==='run'?'load':'dot')}<span>${s.label}</span></li>`).join('')}</ul>${v.pending?`<div class="safety">${svg('shield')}<div><h3>Waiting for the municipal office</h3><p>${OFFICES[0].name} has been notified. You will get a notification here once it reviews your photos.</p></div></div><button class="btn ghost" data-act="officeview">Open municipal office view (demo)</button>`:''}`}
  const spot=state.spot||SPOTS[0];
  const ready=state.before&&state.after&&state.ack;
  return `
  <h2>${spot.name}</h2>
  <div class="sm">${spot.d} ${t('away')} · ${spot.size} · +${spot.pts} ${t('points')}</div>
  <div class="photos">
    <div class="drop">${state.before?`<img alt="${t('before')}" src="${state.before}"><span class="lab">${t('before')}</span>`:`${svg('cam')}<b>${t('before')}</b><input class="sr" type="file" id="f-before" accept="image/*" capture="environment" hidden><button class="btn small" data-act="pick" data-k="before">${t('addPhoto')}</button><button class="link" data-act="sample" data-k="before">Sample</button>`}</div>
    <div class="drop ${state.before&&state.ack?'':'off'}">${state.after?`<img alt="${t('after')}" src="${state.after}"><span class="lab">${t('after')}</span>`:`${svg('cam')}<b>${t('after')}</b><input type="file" id="f-after" accept="image/*" capture="environment" hidden><button class="btn small" data-act="pick" data-k="after" ${state.before&&state.ack?'':'disabled'}>${t('addPhoto')}</button><button class="link" data-act="sample" data-k="after" ${state.before&&state.ack?'':'disabled'}>Sample</button>`}</div>
  </div>
  <div class="safety">${svg('glove')}<div><h3>${t('safety')}</h3><p>${t('safetyText')}</p></div></div>
  <label class="chk"><input type="checkbox" id="ack" ${state.ack?'checked':''}>${t('ack')}</label>
  <button class="btn" data-act="submit" ${ready?'':'disabled'}>${t('submit')}</button>`;
}
function rewards(){
  return `<section class="rbanner"><div style="flex:1;min-width:0"><h2>${t('redeemTitle')}</h2><div class="pts" style="margin-top:8px"><b style="font-size:40px">${state.points}</b><span>${t('points')}</span></div></div><div style="width:92px;flex:none">${binArt('#fffefd','#5c3924','#dac3af')}</div></section>
  ${ptsys()}
  <h2>${t('partner')}</h2>
  <div class="list">${REWARDS.map(r=>{const ok=state.points>=r.cost;return `<div class="row"><div class="thumb">${svg('gift')}</div><div class="grow"><h3>${r.name}</h3><div class="sm">${r.off}</div><span class="pill">${svg('shield')}${t('partner')}</span></div><div style="text-align:end"><b>${r.cost}</b> <span class="sm">${t('cost')}</span><br><button class="btn small" style="margin-top:6px" data-act="redeem" data-id="${r.id}" ${ok?'':'disabled'}>${ok?t('redeem'):t('locked')}</button></div></div>`}).join('')}</div>
  <div class="note">${t('sample')}</div>`;
}
function offices(){
  const f=state.oFilter;
  const list=OFFICES.filter(o=>f==='all'||o.type===f).sort((a,b)=>a.d-b.d);
  const sel=list.find(o=>o.id===state.oSel)||list[0];
  const chips=[['all','All'],['ward','Ward'],['sanitation','Sanitation'],['recycle','Recycling']];
  return `<h2>${t('nearOffices')}</h2>
  <div class="chips">${chips.map(([k,l])=>`<button class="chip" data-act="ofilter" data-k="${k}" aria-pressed="${f===k}">${l}</button>`).join('')}</div>
  <svg class="map" viewBox="0 0 300 180" role="img" aria-label="Map of nearby offices">
    <rect width="300" height="180" fill="#f8f2ec"/>
    <path d="M0 120H300M0 60H300M100 0V180M200 0V180" stroke="#dac3af" stroke-width="10"/>
    <path d="M0 120H300M0 60H300M100 0V180M200 0V180" stroke="#fffefd" stroke-width="6"/>
    ${list.map(o=>`<g data-act="osel" data-id="${o.id}" style="cursor:pointer"><circle cx="${o.x}" cy="${o.y}" r="${sel&&sel.id===o.id?11:8}" fill="${sel&&sel.id===o.id?'#5c3924':'#a77858'}" stroke="#fffefd" stroke-width="2.5"/><circle cx="${o.x}" cy="${o.y}" r="3" fill="#fffefd"/></g>`).join('')}
    <circle cx="150" cy="150" r="14" fill="#5c3924" fill-opacity=".2"/><circle cx="150" cy="150" r="6" fill="#2b190d" stroke="#fffefd" stroke-width="2"/>
  </svg>
  <div class="list">${list.map(o=>`<div class="row" style="${sel&&sel.id===o.id?'border-color:#5c3924;border-width:2px':''}"><div class="thumb">${svg('pin')}</div><div class="grow"><h3>${o.name}</h3><div class="sm">${o.d} km ${t('away')} · <b>${o.open?t('open'):t('closed')}</b></div><div class="sm">${o.hrs}</div><div class="sm" style="user-select:all">${o.ph}</div></div><div style="display:flex;flex-direction:column;gap:6px"><a class="btn small" style="text-decoration:none;text-align:center" href="https://www.google.com/maps/search/${encodeURIComponent(o.name)}" target="_blank" rel="noopener">${t('directions')}</a><button class="btn ghost small" data-act="copy" data-v="${o.ph}">${t('call')}</button></div></div>`).join('')}</div>
  <div class="note">${t('sample')}</div>`;
}
function binArt(c1,c2,c3){
  const arrows=[0,120,240].map(r=>`<g transform="rotate(${r})"><path d="M-13 11H7"/><path d="M3 4l9 7-9 7"/></g>`).join('');
  return `<svg viewBox="0 0 160 190" aria-hidden="true" style="display:block;width:100%;height:auto"><g transform="rotate(-14 56 40)"><rect x="40" y="22" width="30" height="20" rx="5" fill="${c3}"/></g><g transform="rotate(18 100 32)"><rect x="88" y="16" width="24" height="30" rx="5" fill="${c3}"/></g><circle cx="76" cy="14" r="9" fill="${c3}"/><rect x="30" y="62" width="100" height="14" rx="7" fill="${c1}"/><rect x="62" y="54" width="36" height="10" rx="5" fill="${c1}"/><path d="M38 80h84l-8 96a8 8 0 01-8 7H54a8 8 0 01-8-7z" fill="${c1}"/><g transform="translate(80 128)" fill="none" stroke="${c2}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">${arrows}</g></svg>`;
}
function ptsys(){
  const pct=Math.min(100,Math.round(state.points/50*100));
  const left=Math.max(0,50-state.points);
  return `<section class="ptsys"><h2>${t('pointsSystem')}</h2>
  <div class="row"><div class="thumb">${svg('trash')}</div><div class="grow"><h3>${t('pSpot')}</h3><div class="sm">${t('pSpotSub')}</div></div><span class="v">+10</span></div>
  <div class="row"><div class="thumb">${svg('pts')}</div><div class="grow"><h3>${t('pFive')}</h3><div class="sm">${t('pFiveSub')}</div></div><span class="v">50</span></div>
  <div class="row" style="border-bottom:0"><div class="thumb">${svg('gift')}</div><div class="grow"><h3>${t('pCoupon')}</h3><div class="sm">${t('pCouponSub')}</div></div><span class="pill dark">50 ${t('cost')}</span></div>
  <div class="foot"><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="50" aria-valuenow="${Math.min(50,state.points)}"><i style="width:${pct}%"></i></div><div class="sm">${left>0?`${left} ${t('toCoupon')}`:`✓ ${t('pCoupon')}`}</div></div></section>`;
}
function splashRender(){
  const L=LANGS.find(l=>l[0]===state.lang);
  $('#splash').innerHTML=state.splash?`<div class="splash"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div class="brand">EcoRewards</div><button class="langbtn" data-act="langopen">${svg('home').replace(/<path[^>]*>/,'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>')}${L[1]}</button></div><h1>${t('splashTitle')}</h1><div class="art">${binArt('#5c3924','#fffefd','#a77858')}</div><button class="btn light" data-act="begin">${t('getStarted')}</button></div>`:'';
}
function report(){
  const modes=[['clean','modeClean'],['report','modeReport']];
  const tog=`<div class="chips">${modes.map(([k,l])=>`<button class="chip" data-act="mode" data-k="${k}" aria-pressed="${state.mode===k}">${t(l)}</button>`).join('')}</div>`;
  return tog+(state.mode==='clean'?cleanFlow():reportFlow());
}
function reportFlow(){
  const spot=state.spot||SPOTS[0];
  return `<h2>${t('modeReport')}</h2><div class="sm">${spot.name}</div>
  <div class="drop" style="aspect-ratio:16/10">${state.rep?`<img alt="${t('before')}" src="${state.rep}"><span class="lab">${t('before')}</span>`:`${svg('cam')}<input type="file" id="f-rep" accept="image/*" capture="environment" hidden><button class="btn small" data-act="pick" data-k="rep">${t('addPhoto')}</button><button class="link" data-act="sample" data-k="rep">Sample</button>`}</div>
  <button class="btn" data-act="sendrep" ${state.rep?'':'disabled'}>${t('sendReport')}</button>
  ${state.reports.length?`<div class="list">${state.reports.map(reportCard).join('')}</div>`:''}`;
}
function reportCard(r){
  const ks=['st1','st2','st3','st4'];
  return `<div class="row" style="flex-direction:column;align-items:stretch;gap:10px"><div style="display:flex;gap:12px;align-items:center"><div class="thumb" style="overflow:hidden;padding:0"><img alt="" src="${r.step===3?r.after:r.photo}" style="width:100%;height:100%;object-fit:cover"></div><div class="grow"><h3>${r.spot}</h3><div class="sm">#${r.id} · ${r.office}</div></div></div>
  <ul class="checks">${ks.map((k,i)=>`<li class="${i<=r.step?'done':''}">${svg(i<=r.step?'check':'dot')}<span>${t(k)}</span></li>`).join('')}</ul>
  ${r.step<3?`<button class="btn ghost small" data-act="advance" data-id="${r.id}">${t('demoOffice')}</button>`:`<div class="sm"><b>${t('clearedMsg')}</b></div>`}</div>`;
}
function render(){
  const phone=$('#phone');phone.dir=RTL.includes(state.lang)?'rtl':'ltr';phone.lang=state.lang;
  const L=LANGS.find(l=>l[0]===state.lang);$('#langLabel').textContent=L[1];
  $('#introTag').textContent=t('tagline');
  const keep=$('#main').scrollTop;
  $('#main').innerHTML=state.office?officeView():({home,report,rewards,offices})[state.tab]();
  nav();splashRender();{const n=state.notifs.filter(x=>x.unread).length,bd=$('#badge');bd.hidden=!n;bd.textContent=n}
  $('#main').scrollTop=keep;
  const ack=$('#ack');if(ack)ack.onchange=e=>{state.ack=e.target.checked;render()};
}
function sheet(html){ $('#overlay').innerHTML=html?`<div class="sheetbg" data-act="close"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`:'' }
function langSheet(){
  sheet(`<div class="top"><h2>${t('language')}</h2><button class="x" data-act="close" aria-label="${t('close')}">×</button></div>
  <div class="langs">${LANGS.map(l=>`<button data-act="lang" data-k="${l[0]}" aria-pressed="${state.lang===l[0]}"><b>${l[1]}</b><small>${l[2]}${T[l[0]]?'':' · English UI'}</small></button>`).join('')}</div>
  <div class="note">${LANGS.length} languages. Full translation is live for ${Object.keys(T).length}; the rest show English until their translations are added.</div>`);
}
function notify(title,body,kind){
  state.notifs.unshift({title,body,kind,time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),unread:true});
  toast(title);
}
function runVerify(){
  const sp=state.spot||SPOTS[0];
  const labels=['GPS location matches the dump spot','Photo time is within 2 hours of your claim','Before and after photos show the same place, now clear','Sent to '+OFFICES[0].name+' for review'];
  state.verify={done:false,pending:false,result:null,reason:'',pts:sp.pts,steps:labels.map(l=>({label:l,st:'wait'}))};
  render();
  labels.forEach((_,i)=>{
    setTimeout(()=>{state.verify.steps[i].st='run';render()},i*1000);
    setTimeout(()=>{
      if(i<labels.length-1){state.verify.steps[i].st='done'}
      else{
        state.verify.pending=true;
        state.inbox={spot:sp,before:state.before,after:state.after,time:new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})};
        notify('Report sent','Your cleanup at '+sp.name+' was sent to '+OFFICES[0].name+'. You will be notified after review.','info');
      }
      render();
    },i*1000+800);
  });
}
function decide(ok,reason){
  const v=state.verify,sp=state.inbox.spot;
  v.done=true;v.pending=false;v.result=ok?'approved':'rejected';v.reason=reason||'';
  state.inbox=null;
  if(ok){state.points+=v.pts;state.cleaned++;state.kg+=3;notify('Approved: +'+v.pts+' EcoPoints',OFFICES[0].name+' approved your cleanup at '+sp.name+'.','ok')}
  else notify('Not approved',OFFICES[0].name+': '+reason+'. You can submit again.','no');
  render();
}
function officeView(){
  const o=OFFICES[0],r=state.inbox;
  return `<div class="oban"><b>${o.name}</b><span class="sm" style="color:var(--b200)">Municipal office view · demo</span></div>
  ${r?`<h2>New cleanup report</h2><div class="sm">${r.spot.name} · submitted ${r.time}</div>
  <div class="photos"><div class="drop"><img alt="${t('before')}" src="${r.before}"><span class="lab">${t('before')}</span></div><div class="drop"><img alt="${t('after')}" src="${r.after}"><span class="lab">${t('after')}</span></div></div>
  <ul class="checks"><li class="done">${svg('check')}<span>Automatic check: GPS matches the spot</span></li><li class="done">${svg('check')}<span>Automatic check: photo time is recent</span></li></ul>
  <button class="btn" data-act="approve">Approve and send points</button>
  <div class="sm">Or reject because</div>
  <div class="chips" style="flex-wrap:wrap">${['Location does not match','Waste not cleared','Photo unclear','Photo reused'].map(x=>`<button class="chip" data-act="reject" data-k="${x}">${x}</button>`).join('')}</div>`
  :`<div class="row"><div class="thumb">${svg('check')}</div><div class="grow"><h3>Inbox is empty</h3><div class="sm">New reports from users appear here. Submit a cleanup in the user view to see one.</div></div></div>`}
  <button class="btn ghost" data-act="userview">Back to user view</button>`;
}
function notifSheet(){
  state.notifs.forEach(n=>n.unread=false);
  sheet(`<div class="top"><h2>${t('notifs')}</h2><button class="x" data-act="close" aria-label="${t('close')}">×</button></div>
  ${state.notifs.length?`<div class="list">${state.notifs.map(n=>`<div class="row"><div class="thumb">${svg(n.kind==='ok'?'check':n.kind==='no'?'shield':'upload')}</div><div class="grow"><h3>${n.title}</h3><div class="sm">${n.body}</div></div><span class="sm">${n.time}</span></div>`).join('')}</div>`:`<div class="sm">${t('noNotif')}</div>`}`);
  render();
}
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){state.tab=tb.dataset.tab;state.office=false;render();return}
  if(e.target.closest('#langBtn')){langSheet();return}
  if(e.target.closest('#bellBtn')){notifSheet();return}
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,k=a.dataset.k,id=+a.dataset.id;
  if(act==='close'){if(a.classList.contains('sheetbg')&&e.target!==a)return;sheet('');return}
  if(act==='begin'){state.splash=false;render();return}
  if(act==='approve'){decide(true);return}
  if(act==='reject'){decide(false,k);return}
  if(act==='officeview'){state.office=true;render();return}
  if(act==='userview'){state.office=false;state.tab='report';render();return}
  if(act==='langopen'){langSheet();return}
  if(act==='mode'){state.mode=k;render();return}
  if(act==='sendrep'){
    const spot=(state.spot||SPOTS[0]).name;
    state.reports.unshift({id:1041+state.reports.length,photo:state.rep,after:null,spot,office:'Ward 12 Municipal Office',step:0});
    state.rep=null;render();notify(t('st1'),spot+' · Ward 12 Municipal Office','info');return}
  if(act==='advance'){
    const r=state.reports.find(x=>x.id===id);if(!r||r.step>=3)return;
    r.step++;if(r.step===3)r.after=samplePhoto('after');
    render();notify(t(['st1','st2','st3','st4'][r.step]),r.step===3?t('clearedMsg')+' · '+r.spot:r.spot,r.step===3?'ok':'info');return}
  if(act==='lang'){state.lang=k;sheet('');render();return}
  if(act==='spot'){state.spot=SPOTS.find(s=>s.id===id);state.before=state.after=null;state.ack=false;state.verify=null;state.tab='report';render();return}
  if(act==='sample'){state[k]=samplePhoto(k);render();return}
  if(act==='pick'){$('#f-'+k).click();return}
  if(act==='submit'){runVerify();return}
  if(act==='reset'){state.office=false;state.before=state.after=null;state.ack=false;state.verify=null;state.tab='home';render();return}
  if(act==='verifyinfo'){sheet(`<div class="top"><h2>${t('howVerified')}</h2><button class="x" data-act="close" aria-label="${t('close')}">×</button></div>
   <ul class="checks"><li class="done">${svg('check')}<span><b>Location</b><br>Photos must be taken at the reported spot (GPS match).</span></li><li class="done">${svg('check')}<span><b>Time</b><br>Before and after photos are time-stamped by the app. Gallery uploads are rejected.</span></li><li class="done">${svg('check')}<span><b>Visual check</b><br>Automatic comparison confirms the litter is gone.</span></li><li class="done">${svg('check')}<span><b>Human review</b><br>A municipal volunteer approves, and points are issued only after approval.</span></li><li class="done">${svg('check')}<span><b>Privacy</b><br>Faces and number plates are blurred. Your exact location is never shown publicly.</span></li></ul>`);return}
  if(act==='redeem'){const r=REWARDS.find(x=>x.id===id);state.points-=r.cost;render();sheet(`<div class="top"><h2>${r.name}</h2><button class="x" data-act="close" aria-label="${t('close')}">×</button></div><div class="sm">${r.off}</div><div class="sm">${t('yourCode')}</div><div class="code">ECO-${(r.id*7919+state.points).toString(36).toUpperCase().padStart(5,'7')}</div><div class="note">${t('sample')}</div>`);return}
  if(act==='ofilter'){state.oFilter=k;render();return}
  if(act==='osel'){state.oSel=id;render();return}
  if(act==='copy'){const v=a.dataset.v;const ok=()=>toast(v);try{navigator.clipboard.writeText(v).then(ok,ok)}catch(_){ok()}return}
});
document.addEventListener('change',e=>{
  if(e.target.matches('input[type=file]')){
    const f=e.target.files[0];if(!f)return;const k=e.target.id.replace('f-','');
    const r=new FileReader();r.onload=()=>{state[k]=r.result;render()};r.readAsDataURL(f);
  }
});
render();
</script>
</body>
</html>
